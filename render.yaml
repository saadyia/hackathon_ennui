# Déploiement en un clic sur Render (https://render.com) : New > Blueprint > ce dépôt.
# Lien public en HTTPS, nécessaire pour installer la PWA sur iPhone avec son service worker.
services:
  - type: web
    name: ofk
    runtime: docker            # utilise le Dockerfile à la racine (PORT fourni par Render)
    plan: free
    healthCheckPath: /api/sante
    autoDeploy: true
    envVars:
      - key: ENNUI_SYNC          # synchronisation OpenAgenda toutes les 6 h (0 pour la couper)
        value: "1"
      - key: ENNUI_ORIGINES      # CORS : origines autorisées, séparées par des virgules (« * » = toutes)
        value: "*"
      - key: DATABASE_URL        # PostgreSQL Neon (postgresql://…?sslmode=require) : comptes, amis, plans conservés
        sync: false              # à coller dans le tableau de bord Render, jamais dans le dépôt
      # - key: TMDB_API_KEY      # facultatif, à saisir dans le tableau de bord Render (jamais dans le dépôt)
      #   sync: false
    # Plan gratuit : le service s'endort après 15 min sans visite (réveil ~30 à 60 s) ; ouvrir le lien avant la démo.
    # Sans DATABASE_URL, SQLite sur disque éphémère : comptes, amis et plans repartent de zéro à chaque redéploiement.
    # Avec DATABASE_URL (Neon, gratuit) : tout est conservé.
